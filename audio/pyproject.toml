[project]
name = "cheating-detection-audio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyannote.audio==4.0.7",
    "torch>=2.8",
    "torchaudio>=2.8",
    "torchcodec>=0.7",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
